<svg fill="none" viewBox="0 0 800 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(-45deg, #1e1b4b, #312e81, #1e293b, #0f172a);
          background-size: 400% 400%;
          animation: gradientShift 10s ease infinite;
          border-radius: 16px;
          height: 240px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          color: white;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }

        @keyframes gradientShift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .bubble {
          position: absolute;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.06);
          animation: floatUp 6s infinite ease-in-out;
        }

        .b1 { width: 80px; height: 80px; left: 10%; bottom: -30px; animation-delay: 0s; }
        .b2 { width: 50px; height: 50px; right: 15%; bottom: -20px; animation-delay: 2s; }
        .b3 { width: 120px; height: 120px; right: 30%; bottom: -50px; animation-delay: 4s; }

        @keyframes floatUp {
          0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
          50% { transform: translateY(-130px) rotate(180deg); opacity: 0.6; }
          100% { transform: translateY(-240px) rotate(360deg); opacity: 0; }
        }

        .badge-pill {
          background: rgba(255, 255, 255, 0.12);
          border: 1px solid rgba(255, 255, 255, 0.25);
          backdrop-filter: blur(8px);
          padding: 6px 16px;
          border-radius: 9999px;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin-bottom: 12px;
          animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.04); }
        }

        .title {
          font-size: 38px;
          font-weight: 800;
          margin: 0;
          background: linear-gradient(90deg, #ffffff, #fef08a, #60a5fa, #ffffff);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shine 4s linear infinite;
        }

        @keyframes shine {
          to { background-position: 200% center; }
        }

        .typing-wrapper {
          margin-top: 10px;
          font-size: 16px;
          color: #cbd5e1;
          display: flex;
          align-items: center;
        }

        .cursor {
          display: inline-block;
          width: 2px;
          height: 18px;
          background-color: #facc15;
          margin-left: 4px;
          animation: blink 0.8s infinite;
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }
      </style>

      <div class="container">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="badge-pill">⚡ FAST &bull; REACT 18 &bull; VITE</div>
        <h1 class="title">📝 React Sticky Notes App</h1>
        <div class="typing-wrapper">
          <span>Organize your ideas effortlessly &bull; Auto-saved to LocalStorage</span>
          <span class="cursor"></span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
