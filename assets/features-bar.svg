<svg fill="none" viewBox="0 0 800 130" width="100%" height="130" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .grid-container {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          height: 120px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card {
          background: #ffffff;
          border-radius: 12px;
          border: 1px solid #e2e8f0;
          padding: 12px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
          position: relative;
          overflow: hidden;
          animation: floatCard 4s ease-in-out infinite alternate;
        }

        .card:nth-child(1) { animation-delay: 0s; }
        .card:nth-child(2) { animation-delay: 0.5s; }
        .card:nth-child(3) { animation-delay: 1.0s; }
        .card:nth-child(4) { animation-delay: 1.5s; }

        @keyframes floatCard {
          0% { transform: translateY(0px); }
          100% { transform: translateY(-4px); }
        }

        .card::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
        }

        .c1::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .c2::before { background: linear-gradient(90deg, #10b981, #34d399); }
        .c3::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .c4::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

        .icon {
          font-size: 22px;
          margin-bottom: 4px;
        }

        .title {
          font-size: 13px;
          font-weight: 700;
          color: #0f172a;
          margin-bottom: 2px;
        }

        .subtitle {
          font-size: 11px;
          color: #64748b;
        }
      </style>

      <div class="grid-container">
        <div class="card c1">
          <div class="icon">💾</div>
          <div class="title">Local Persistence</div>
          <div class="subtitle">Auto-syncs via useEffect</div>
        </div>

        <div class="card c2">
          <div class="icon">🎯</div>
          <div class="title">Smart Focus</div>
          <div class="subtitle">useRef auto-focus hook</div>
        </div>

        <div class="card c3">
          <div class="icon">⚡</div>
          <div class="title">150 Char Limit</div>
          <div class="subtitle">Real-time live countdown</div>
        </div>

        <div class="card c4">
          <div class="icon">📱</div>
          <div class="title">Responsive Grid</div>
          <div class="subtitle">Adapts to any screen</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
